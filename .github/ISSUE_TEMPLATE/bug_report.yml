name: Bug report
description: Report a reproducible problem with the required project context.
body:
  - type: markdown
    attributes:
      value: Include browser/OS, PageScope build, report source (local Lighthouse, PageSpeed or import),
        Lighthouse version, device and settings. Remove private URLs and request data; use a
        synthetic or sanitized report. Lab metrics are not real-user measurements.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment and source context
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation performed or planned
    validations:
      required: true
