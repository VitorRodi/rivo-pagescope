name: Maintenance
description: Propose evidence-backed documentation, test or tooling maintenance.
body:
  - type: markdown
    attributes:
      value: Include browser/OS, PageScope build, report source (local Lighthouse, PageSpeed or import),
        Lighthouse version, device and settings. Remove private URLs and request data; use a
        synthetic or sanitized report. Lab metrics are not real-user measurements.
  - type: textarea
    id: evidence
    attributes:
      label: Problem and evidence
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and boundaries
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Verifiable acceptance criteria
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment and source context
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation performed or planned
    validations:
      required: true
